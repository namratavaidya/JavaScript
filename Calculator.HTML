<!DOCTYPE html>
<html>

<head>

    <title>Arithmetic Calculator</title>

    <style>

        body{

            margin:0;
            padding:0;
            font-family:Verdana, Geneva, Tahoma, sans-serif;
            background:linear-gradient(135deg,#5f2c82,#49a09d);

        }

        .calculator{

            width : 420px;
            margin:60px auto;
            background:#ffffff;
            border-radius:20px;
            padding:30px;
            text-align:center;
            box-shadow:0px 0px 25px rgba(0,0,0,0.4);

        }

        h1{

            color:#5f2c82;

        }

        input{

            width : 90%;
            padding:12px;
            margin:12px;
            border:2px solid #5f2c82;
            border-radius:30px;
            font-size:17px;
            text-align:center;

        }

        .buttons{

            margin-top : 15px;

        }

        button{

            width : 160px;
            padding:12px;
            margin:8px;
            border:none;
            border-radius:30px;
            background:#ff6f00;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;

        }

        button:hover{

            background:#5f2c82;

        }

        #result{

            margin-top : 20px;
            font-size:24px;
            color:#d81b60;
            font-weight:bold;

        }

    </style>

</head>

<body>

<div class="calculator">

<h1>🔢 Arithmetic Calculator</h1>

<input type="number" id="num1" placeholder="Enter Number 1">

<input type="number" id="num2" placeholder="Enter Number 2">

<div class="buttons">

<button onclick="addition()">Add</button>

<button onclick="subtraction()">Subtract</button>

<br>

<button onclick="multiplication()">Multiply</button>

<button onclick="division()">Divide</button>

</div>

<h2 id="result">Result</h2>

</div>

<script>

function addition(){

    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    document.getElementById("result").innerHTML="Sum = "+(a+b);

}

function subtraction(){

    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    document.getElementById("result").innerHTML="Difference = "+(a-b);

}

function multiplication(){

    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    document.getElementById("result").innerHTML="Product = "+(a*b);

}

function division(){

    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    if(b==0){

        document.getElementById("result").innerHTML="Division Not Possible";

    }

    else{

        document.getElementById("result").innerHTML="Quotient = "+(a/b);

    }

}

</script>

</body>

</html>
