
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Record Viewer</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f4f7fb;
      color: #222;
    }
    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      background: #2457c5;
      color: white;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      overflow-wrap: anywhere;
    }
    th { background: #2457c5; color: white; }
    #status { margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Record Viewer</h2>
    <p>Load student records using two different methods.</p>

    <button onclick="loadUsingFetch()">Load Using Fetch</button>
    <button onclick="loadUsingJQuery()">Load Using jQuery</button>

    <p id="status">Click a button to load records.</p>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody id="studentData"></tbody>
    </table>
  </div>

  <script>
    const api = "https://jsonplaceholder.typicode.com/users";

    function displayStudents(students) {
      const tbody = document.getElementById("studentData");
      tbody.replaceChildren();

      students.forEach(student => {
        const row = document.createElement("tr");

        [student.id, student.name, student.email].forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });

        tbody.appendChild(row);
      });

      document.getElementById("status").textContent =
        students.length + " records loaded successfully.";
    }

    async function loadUsingFetch() {
      document.getElementById("status").textContent = "Loading...";
      try {
        const response = await fetch(api);
        if (!response.ok) throw new Error("Request failed");
        const students = await response.json();
        displayStudents(students);
      } catch (error) {
        document.getElementById("status").textContent =
          "Unable to load records. Check your internet connection.";
      }
    }

    function loadUsingJQuery() {
      $("#status").text("Loading...");
      $.getJSON(api)
        .done(function(students) {
          displayStudents(students);
        })
        .fail(function() {
          $("#status").text("Unable to load records. Try again.");
        });
    }
  </script>
</body>
</html>
