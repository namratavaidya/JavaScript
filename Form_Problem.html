<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h2>Student Registeration Form</h2>
        <form action="#" method="get">

            <table>

                <tr>
                    <td>Full Name</td>
                    <td><input type="text" name="fullName" required></td>
                </tr>

                <tr>
                    <td>Email</td>
                    <td><input type="email" name="email" required></td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td><input type="password" name="password" required></td>
                </tr>

                <tr>
                    <td>Mobile Number</td>
                    <td><input type="tel" name="mobile" required></td>
                </tr>

                <tr>
                    <td>Age</td>
                    <td><input type="number" name="age" min="18" max="100"required></td>
                </tr>

                <tr>
                    <td>Date of Birth</td>
                    <td><input type="date" name="dob" required></td>
                </tr>

                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" name="gender" value="male" required>Male
                        <input type="radio" name="gender" value="female" required>Female
                        <input type="radio" name="gender" value="other" required>Other
                    </td>
                </tr>

                <tr>
                    <td>Hobbies</td>
                    <td><input type="checkbox" name="hobby" value="reading">Reading
                        <input type="checkbox" name="hobby" value="sports">Sports
                        <input type="checkbox" name="hobby" value="music">Music
                    </td>
                </tr>

                <tr>
                    <td>Country</td>
                    <td>
                        <select name="country">
                            <option value="">Select Country</option>
                            <option value="usa">USA</option>
                            <option value="uk">UK</option>
                            <option value="india">India</option>
                            <option value="australia">Australia</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Address</td>
                    <td>
                        <textarea name="address" rows="4"></textarea>
                    </td>
                </tr>

                <tr>
                    <td>Upload Photo</td>
                    <td><input type="file" name="photo"></td>
                </tr>
                <tr>
                    <td>Favorite Color</td>
                    <td><input type="color" name="color" required></td>
                </tr>

                <tr>
                    <td>Skill Level</td>
                    <td><input type="range" name="skill" min="0" max="100"></td>
                </tr>

                <tr>
                    <td>Website</td>
                    <td><input type="url" name="website"></td>
                </tr>

                <tr>
                    <td>Preferred Time</td>
                    <td><input type="time" name="Time"></td>
                </tr>

                <tr>
                    <td colspan="2" class="bottons">
                        <input type="submit" value="Register">
                        <input type="reset" value="Clear">
                    </td>
                </tr>

            </table>
        </form>
    </div>
</body>
</html>
